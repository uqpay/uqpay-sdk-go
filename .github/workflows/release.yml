name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Verify release tag and version
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full test suite
        env:
          SKIP_INTEGRATION_TESTS: "true"
        run: go test -v ./...

      - name: Run static checks
        run: go vet ./...

      - name: Verify artifact version
        run: |
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
          go list -m
          go build ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check whether GitHub Release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Release commit: `${{ github.sha }}`

            ### Installation

            ```bash
            go get github.com/uqpay/uqpay-sdk-go@${{ github.ref_name }}
            ```

            See [README.md](https://github.com/uqpay/uqpay-sdk-go/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
