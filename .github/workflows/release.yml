name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release_mode: ${{ startsWith(github.ref, 'refs/tags/v') }}
      release_tag: ${{ github.ref_name }}

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check whether GitHub Release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Release commit: `${{ github.sha }}`

            ### Installation

            ```bash
            go get github.com/uqpay/uqpay-sdk-go/v3@${{ github.ref_name }}
            ```

            See [README.md](https://github.com/uqpay/uqpay-sdk-go/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
