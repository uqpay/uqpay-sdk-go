name: Verify only

# Branch pushes validate before a PR exists. No tag trigger or publishing jobs.
on:
  push:
    branches:
      - 'marshall/api-delivery/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_mode:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.19', '1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.release_mode }}
          ref: ${{ inputs.release_mode && inputs.release_tag || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify release tag and version
        if: inputs.release_mode
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Verify tag commit is on main
        if: inputs.release_mode
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full test suite
        env:
          SKIP_INTEGRATION_TESTS: "true"
        run: go test -v ./...

      - name: Run static checks
        run: go vet ./...

      - name: Build module
        run: |
          go list -m
          go build ./...

      - name: Verify artifact version
        if: inputs.release_mode
        run: |
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
